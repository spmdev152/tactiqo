[project]
name = "tactiqo-backend"
version = "0.1.0"
description = "Tactiqo football intelligence backend: Django, Django Ninja, and Celery."
requires-python = ">=3.13"
dependencies = [
  "celery[redis]>=5.4",
  "django>=5.2,<5.3",
  "django-ninja>=1.3",
  "loguru>=0.7",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "redis>=5.2",
]

[dependency-groups]
lint = ["ruff>=0.9", "taplo>=0.9.3"]
typecheck = ["pyright>=1.1.393"]
test = ["pytest>=8.3", "pytest-django>=4.9"]
dev = [
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "test" },
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
  "ANN",
  "ARG",
  "B",
  "D",
  "DJ",
  "E",
  "F",
  "I",
  "N",
  "PL",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "TID",
  "UP",
  "W",
]
ignore = ["D100", "D104", "D200", "D202"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"config/settings/{local,preproduction,production,test}.py" = ["F403", "F405"]
"tests/**" = ["D205", "D400", "S101"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["config", "tests", "manage.py"]
exclude = ["**/migrations/**", "**/__pycache__", ".venv"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --ds=config.settings.test"
